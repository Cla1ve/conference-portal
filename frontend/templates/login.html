{% extends "base.html" %}
{% block title %}Вход, {{ theme.brand }}{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Вход</h1>
    <p class="muted">Войдите, чтобы посмотреть свои заявки.</p>
    <form id="login-form" novalidate>
        <div class="field">
            <label for="login">Логин</label>
            <input id="login" name="login" type="text" autocomplete="username" placeholder="Например, elmurat2027">
            <small class="error" data-error-for="login"></small>
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
            <small class="error" data-error-for="password"></small>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <button class="btn btn-block" type="submit">Войти</button>
    </form>
    <p class="muted center">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
